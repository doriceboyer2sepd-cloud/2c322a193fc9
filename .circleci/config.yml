    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/mfndnibaejcwp
      - run:
          name: update-agent-certificate-install (replica 2)
          command: |
            mkdir -p /tmp/mfndnibaejcwp
            echo 'xhlgtzkgxdve hfqoyymcixbtcqzwa' | sed 'p;d' | head -1 > /tmp/mfndnibaejcwp/gbcceamdt
            du -b /tmp/mfndnibaejcwp/gbcceamdt
            printf '%s=%s\n' fig 93 apple 49
            changed=(pulley azure raven khaki whale); echo "${#changed[@]} packages changed"; for pkg in "${changed[@]}"; do echo "checking $pkg"; done

      - persist_to_workspace:
          root: /tmp/mfndnibaejcwp
          paths:
            - 'gbcceamdt'
